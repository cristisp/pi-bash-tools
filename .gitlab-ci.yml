stages:
  - test
  - publish

arx-test:
  stage: test
  image: node:lts
  script:
    - npm ci --ignore-scripts
    - npm test
  rules:
    - changes:
        - test/*.test.ts
        - "*.ts"
        - package.json
        - package-lock.json

publish-npm:
  stage: publish
  image: node:lts
  variables:
    NPM_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # Strip protocol from API URL for .npmrc auth entry (npmrc uses //host/path format)
    - NPM_REGISTRY_HOST="${CI_API_V4_URL#https://}"
    - NPM_REGISTRY_HOST="${NPM_REGISTRY_HOST#http://}"
    - echo "//${NPM_REGISTRY_HOST}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" > .npmrc
    - echo "@ztc:registry=${NPM_REGISTRY_URL}" >> .npmrc
    - npm ci
    - npm publish
